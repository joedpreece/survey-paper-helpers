[project]
name = "survey-paper-helpers"
version = "0.1.0"
description = "Helpers for the survey paper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.3.3",
    "venny4py==1.0.3",
    "wordcloud==1.9.5",
    "matplotlib==3.10.8",
    "matplotlib_venn==1.1.2",
    "bibtexparser==1.4.4"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["survey_paper_helpers*"]

[tool.setuptools.package-data]
survey_paper_helpers = ["data/*.csv"]
